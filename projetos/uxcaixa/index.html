<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAPP Fase 21 — Documentação de Teste de Usabilidade</title>

  <!-- Google Fonts: Roboto & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" rel="stylesheet">

  <!-- Estilos M3 -->
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/print.css" media="print">
</head>
<body>
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

  <div class="app-shell">
    <!-- TopAppBar M3 -->
    <header class="top-app-bar" role="banner">
      <div class="top-app-bar__leading">
        <span class="material-symbols-outlined top-app-bar__brand-icon" aria-hidden="true">assignment</span>
        <div class="top-app-bar__titles">
          <span class="top-app-bar__title" id="app-project-title">SuperAPP Fase 21</span>
          <span class="top-app-bar__subtitle" id="save-status-indicator" aria-live="polite">Sincronizado</span>
        </div>
      </div>

      <div class="top-app-bar__actions">
        <!-- Botão Exportar JSON -->
        <button type="button" class="m3-button m3-button--outlined" id="btn-export-json" aria-label="Exportar dados do projeto em JSON">
          <span class="material-symbols-outlined" aria-hidden="true">download</span>
          <span class="btn-label-desktop">Exportar JSON</span>
        </button>

        <!-- Botão Importar JSON -->
        <button type="button" class="m3-button m3-button--tonal" id="btn-import-json" aria-label="Importar arquivo JSON">
          <span class="material-symbols-outlined" aria-hidden="true">upload</span>
          <span class="btn-label-desktop">Importar JSON</span>
        </button>
        <input type="file" id="input-import-file" accept=".json,application/json" hidden>

        <!-- Alternância de Tema (Ícone apenas: Lua no claro, Sol no escuro) -->
        <button
          type="button"
          class="m3-icon-button"
          id="btn-theme-toggle"
          aria-label="Alternar para tema escuro"
          title="Alternar tema"
        >
          <span class="material-symbols-outlined" id="theme-toggle-icon" aria-hidden="true">dark_mode</span>
        </button>
      </div>
    </header>

    <!-- Layout Principal (Navigation + Content) -->
    <div class="app-body">
      <!-- NavigationDrawer (Expanded >= 840dp) & NavigationRail (Medium 600-839dp) -->
      <aside class="nav-sidebar" aria-label="Navegação de documentos">
        <div class="nav-sidebar__header">
          <span class="nav-sidebar__section-label">Documentos</span>
        </div>
        <nav class="nav-sidebar__list" id="sidebar-nav-list" role="navigation"></nav>
      </aside>

      <!-- Área Principal de Conteúdo -->
      <main id="main-content" class="main-content" tabindex="-1">
        <!-- Faixa de Cabeçalho do Documento (primaryContainer / primary) -->
        <section class="doc-banner" aria-labelledby="doc-banner-title">
          <div class="doc-banner__content">
            <div class="doc-banner__meta">
              <span class="m3-chip m3-chip--assist" id="doc-banner-project">SuperAPP Fase 21</span>
            </div>
            <h1 class="doc-banner__title" id="doc-banner-title">Plano de Pesquisa</h1>
          </div>

          <div class="doc-banner__actions">
            <button type="button" class="m3-button m3-button--outlined doc-banner__btn" id="btn-restore-doc" aria-label="Restaurar conteúdo original deste documento">
              <span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>
              <span>Restaurar original</span>
            </button>
            <button type="button" class="m3-button m3-button--filled" id="btn-print-doc" aria-label="Imprimir documento atual">
              <span class="material-symbols-outlined" aria-hidden="true">print</span>
              <span>Imprimir</span>
            </button>
          </div>
        </section>

        <!-- Container onde o Renderer M3 injeta o documento ativo -->
        <div class="doc-container" id="document-mount"></div>
      </main>
    </div>

    <!-- NavigationBar M3 (Compact < 600dp, 3 destinos) -->
    <nav class="nav-bottom-bar" id="bottom-nav-list" aria-label="Navegação inferior de documentos"></nav>
  </div>

  <!-- Modal Dialog M3 -->
  <div class="m3-dialog-scrim" id="m3-dialog-scrim" hidden>
    <div
      class="m3-dialog"
      id="m3-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="m3-dialog-title"
      aria-describedby="m3-dialog-desc"
    >
      <div class="m3-dialog__icon-wrap" id="m3-dialog-icon-wrap" hidden>
        <span class="material-symbols-outlined" id="m3-dialog-icon" aria-hidden="true">warning</span>
      </div>
      <h2 class="m3-dialog__title" id="m3-dialog-title">Confirmar ação</h2>
      <p class="m3-dialog__desc" id="m3-dialog-desc"></p>
      <div class="m3-dialog__actions" id="m3-dialog-actions"></div>
    </div>
  </div>

  <!-- Snackbar M3 -->
  <div class="m3-snackbar-region" aria-live="polite" aria-atomic="true">
    <div class="m3-snackbar" id="m3-snackbar" hidden>
      <span class="m3-snackbar__text" id="m3-snackbar-text"></span>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
