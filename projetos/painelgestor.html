<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Gestão PUXE — UX & DesignOps Leadership</title>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            blue: '#007AFF',
                            darkBlue: '#0A84FF',
                            gray: '#8E8E93',
                            gray6: '#F2F2F7',
                            darkBg: '#000000',
                            darkCard: '#1C1C1E',
                            darkCard2: '#2C2C2E',
                            orange: '#FF9500',
                            purple: '#AF52DE',
                            green: '#34C759'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome para Ícones complementares -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        /* Glassmorphism e Barra de Navegação estilo macOS Sidebar */
        .apple-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .apple-glass {
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .nav-item {
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.8125rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #8E8E93;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background-color: rgba(0, 0, 0, 0.04);
            color: #1D1D1F;
        }

        .dark .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.06);
            color: #F5F5F7;
        }

        .nav-item.active {
            background-color: #007AFF;
            color: #FFFFFF !important;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(0, 122, 255, 0.25);
        }

        .dark .nav-item.active {
            background-color: #0A84FF;
            box-shadow: 0 2px 12px rgba(10, 132, 255, 0.35);
        }

        /* Oculta a barra de rolagem mas permite rolar */
        iframe::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-[#F5F5F7] dark:bg-black text-[#1D1D1F] dark:text-[#F5F5F7] h-screen flex flex-col overflow-hidden font-sans antialiased">

    <!-- Header Principal da Liderança -->
    <header class="h-16 apple-glass border-b border-black/5 dark:border-white/10 px-6 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-apple-blue flex items-center justify-center text-white shadow-md shadow-apple-blue/20">
                <i class="fa-solid fa-crown text-sm"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-black dark:text-white leading-tight flex items-center gap-2">
                    Central de Gestão PUXE <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-apple-blue/10 text-apple-blue dark:text-apple-darkBlue">UX & DesignOps</span>
                </h1>
                <p class="text-[11px] text-apple-gray">Hub executivo integrando diagnósticos de time, maturidade e habilidades</p>
            </div>
        </div>

        <!-- Controles Globais do Hub -->
        <div class="flex items-center gap-3">
            <!-- Botão de Atualizar Iframe Atual -->
            <button onclick="recarregarSistemaAtual()" title="Recarregar Sistema Ativo" class="w-9 h-9 rounded-full bg-apple-gray6 dark:bg-apple-darkCard2 flex items-center justify-center text-apple-gray hover:text-black dark:hover:text-white transition-all border border-black/5 dark:border-white/10">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>

            <!-- Alternador de Tema Nativo Lucide -->
            <button type="button" id="themeToggleBtn" onclick="toggleTheme()" title="Alternar entre Modo Escuro e Modo Claro" class="w-9 h-9 rounded-full bg-apple-gray6 dark:bg-apple-darkCard2 flex items-center justify-center text-apple-gray hover:text-black dark:hover:text-white transition-all border border-black/5 dark:border-white/10">
                <i data-lucide="moon" id="themeIcon" class="w-4 h-4 text-apple-orange"></i>
            </button>
        </div>
    </header>

    <!-- Estrutura do Shell: Sidebar + Área de Conteúdo Iframe -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Lateral de Navegação (Estilo macOS / iPadOS) -->
        <aside class="w-64 apple-glass border-r border-black/5 dark:border-white/10 p-4 flex flex-col justify-between shrink-0 z-10">
            <div class="space-y-6">
                <div>
                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-apple-gray px-3 block mb-2">Painéis da Liderança</span>
                    
                    <nav class="space-y-1">
                        <!-- Sistema 1: Dashboard Estratégico -->
                        <div onclick="carregarSistema(this, 'puxe.html')" class="nav-item active">
                            <i class="fa-solid fa-chart-line text-sm"></i>
                            <span>Dashboard Estratégico</span>
                        </div>

                        <!-- Sistema 2: Maturidade do Time -->
                        <div onclick="carregarSistema(this, 'maturidadeuxpuxe.html')" class="nav-item">
                            <i class="fa-solid fa-award text-sm"></i>
                            <span>Maturidade do Time</span>
                        </div>

                        <!-- Sistema 3: Skill Mapping -->
                        <div onclick="carregarSistema(this, 'skillmappingpuxe.html')" class="nav-item">
                            <i class="fa-solid fa-bullseye text-sm"></i>
                            <span>Skill Mapping</span>
                        </div>
                    </nav>
                </div>
            </div>

            <!-- Card Informativo Inferior da Sidebar -->
            <div class="apple-card p-3 space-y-1 dark:bg-apple-darkCard">
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-apple-green animate-pulse"></span>
                    <span class="text-[10px] font-bold text-apple-green uppercase">Google Sheets Ativo</span>
                </div>
                <p class="text-[11px] text-apple-gray leading-tight">Métricas e perfis sincronizados em tempo real com a base PUXE.</p>
            </div>
        </aside>

        <!-- Área Principal de Exibição (Container do Iframe) -->
        <main class="flex-1 h-full w-full relative bg-[#F5F5F7] dark:bg-black">
            <!-- Iframe Dinâmico (Inicia com o Dashboard Estratégico 'puxe.html') -->
            <iframe id="mainAppIframe" src="puxe.html" class="w-full h-full border-none" title="Módulo de Gestão Ativo"></iframe>
        </main>

    </div>

    <!-- Script de Integração e Controle -->
    <script>
      // Inicializa Lucide Icons ao carregar a página
document.addEventListener('DOMContentLoaded', () => {
    carregarTemaSalvo();
    
    // Notifica o iframe do tema atual assim que ele terminar de carregar
    const iframe = document.getElementById('mainAppIframe');
    iframe.addEventListener('load', () => {
        notificarIframeTema();
    });
});

// Alterna entre os arquivos HTML no Iframe
function carregarSistema(element, urlArquivo) {
    const items = document.querySelectorAll('.nav-item');
    items.forEach(item => item.classList.remove('active'));

    element.classList.add('active');

    const iframe = document.getElementById('mainAppIframe');
    iframe.src = urlArquivo;
}

// Recarrega o módulo atual dentro do Iframe
function recarregarSistemaAtual() {
    const iframe = document.getElementById('mainAppIframe');
    iframe.contentWindow.location.reload();
}

// Sistema de Tema Unificado para o Shell
function toggleTheme() {
    const html = document.documentElement;
    const currentTheme = html.getAttribute('data-theme') || (html.classList.contains('dark') ? 'dark' : 'light');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

    aplicarTema(newTheme);
    localStorage.setItem('apple_theme_pref', newTheme);
    
    // Avisa o iframe sobre a mudança de tema
    notificarIframeTema();
}

function aplicarTema(theme) {
    const html = document.documentElement;
    const icon = document.getElementById('themeIcon');

    html.setAttribute('data-theme', theme);

    if (theme === 'dark') {
        html.classList.add('dark');
        html.classList.remove('light');
        if (icon) {
            icon.setAttribute('data-lucide', 'sun');
            icon.className = "w-4 h-4 text-apple-orange";
        }
    } else {
        html.classList.remove('dark');
        html.classList.add('light');
        if (icon) {
            icon.setAttribute('data-lucide', 'moon');
            icon.className = "w-4 h-4 text-apple-orange";
        }
    }

    if (window.lucide) {
        lucide.createIcons();
    }
}

function carregarTemaSalvo() {
    const savedTheme = localStorage.getItem('apple_theme_pref') || 'light';
    aplicarTema(savedTheme);
}

// FUNÇÃO CHAVE: Envia mensagem para o iframe com o tema ativo
function notificarIframeTema() {
    const iframe = document.getElementById('mainAppIframe');
    const currentTheme = localStorage.getItem('apple_theme_pref') || 'light';
    
    if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ 
            type: 'CHANGE_THEME', 
            theme: currentTheme,
            hideThemeBtn: true // Instrução para esconder o botão interno
        }, '*');
    }
}
    </script>
</body>
</html>
