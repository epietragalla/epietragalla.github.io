<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UX Flow — Gestão & Documentação de UX Design</title>
  
  <!-- Fontes M3: Roboto & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" rel="stylesheet" />

  <!-- Estilos M3 -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/views.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Navegação Adaptativa: Drawer (>=840px) / Rail (600-839px) -->
    <aside id="nav-sidebar" class="nav-sidebar" aria-label="Navegação principal"></aside>

    <div class="app-main-wrapper">
      <!-- TopAppBar M3 -->
      <header id="top-app-bar" class="top-app-bar"></header>

      <!-- Timeline Sticky do Projeto (renderizada quando dentro de um projeto) -->
      <div id="project-sticky-timeline" class="sticky-timeline-container" hidden></div>

      <!-- Área Principal de Conteúdo -->
      <main id="main-content" class="main-content" tabindex="-1"></main>
    </div>

    <!-- NavigationBar para Compact (<600px) -->
    <nav id="nav-bottom-bar" class="nav-bottom-bar" aria-label="Navegação inferior"></nav>
  </div>

  <!-- Camadas Globais M3 -->
  <div id="modal-root" class="modal-root" hidden></div>
  <div id="snackbar-root" class="snackbar-root" role="status" aria-live="polite"></div>
  <div id="sr-announcer" class="sr-only" aria-live="assertive"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
