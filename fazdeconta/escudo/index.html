<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escudo do Mestre - Faz de Conta RPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&family=MedievalSharp&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER WITH LOGO & NAVIGATION -->
    <header>
        <div class="header-title-container">
            <div class="logo-area">
                <button id="hamburger-btn" class="hamburger-btn" onclick="toggleMobileMenu()" aria-label="Abrir Menu">
                    ☰
                </button>
                <div class="logo-icon">🌳🗡️</div>
                <div class="logo-text">
                    <h1>FAZ DE CONTA RPG</h1>
                    <span>Escudo do Mestre 2.0-Beta</span>
                </div>
            </div>

            <!-- DICE ROLLER QUICK WIDGET (TAMANHO ORIGINAL) -->
            <div class="quick-stats">
                <div class="quick-stat-item">
                    <span>Dado Rápido:</span>
                    <button class="btn-dice" onclick="rollDice(1)">1d6</button>
                    <button class="btn-dice" onclick="rollDice(2)">2d6</button>
                </div>
                <div id="quick-dice-result" class="dice-result">-</div>
            </div>
        </div>

        <!-- NAVIGATION TABS -->
        <nav class="nav-tabs" id="nav-tabs-menu">
            <button class="tab-btn active" onclick="switchTab('tab-combate')">⚔️ Regras</button>
            <button class="tab-btn" onclick="switchTab('tab-bestiario')">🐞 Bestiário</button>
            <button class="tab-btn" onclick="switchTab('tab-criticos')">💥 Críticos & Lesão</button>
            <button class="tab-btn" onclick="switchTab('tab-xp')">⭐ Progresso</button>
            <button class="tab-btn" onclick="switchTab('tab-tesouros')">💎 Itens</button>
            <button class="tab-btn" onclick="switchTab('tab-mundo')">🗺️ Locais</button>
            <button class="tab-btn" onclick="switchTab('tab-dicas')">📜 Dicas do Mestre</button>
            <button class="tab-btn" onclick="switchTab('tab-gerador')">🎲 Missões</button>
            <button class="tab-btn" onclick="switchTab('tab-musicas')">🎵 Trilha Sonora</button>
        </nav>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main>

        <div id="tab-combate" class="tab-content" data-include="tab-combate.html"></div>
        <div id="tab-bestiario" class="tab-content" data-include="tab-bestiario.html"></div>
        <div id="tab-criticos" class="tab-content" data-include="tab-criticos.html"></div>
        <div id="tab-xp" class="tab-content" data-include="tab-xp.html"></div>
        <div id="tab-tesouros" class="tab-content" data-include="tab-tesouros.html"></div>
        <div id="tab-mundo" class="tab-content" data-include="tab-mundo.html"></div>
        <div id="tab-dicas" class="tab-content" data-include="tab-dicas.html"></div>
        <div id="tab-gerador" class="tab-content" data-include="tab-gerador.html"></div>
        <div id="tab-musicas" class="tab-content" data-include="tab-musicas.html"></div>



    </main>

    <!-- FOOTER -->
    <footer>
        <p><strong>Faz de Conta RPG</strong> • Criado por Neemias de Oliveira Guimarães • "Um Grande RPG para
            Pequeninos!"</p>
        <p style="margin-top: 4px; font-size: 0.75rem;">Escudo do Mestre Interativo & Responsive UI • Desenvolvido para
            auxílio em mesa.</p>
    </footer>

    <script type="module" src="webllm.js"></script>
    <script src="script.js"></script>
</body>

</html>
