<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faz de Conta RPG | Livro-Jogo Solo</title>
  <!-- Fontes Retrô / Fantasia / Pixel Art -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. VARIÁVEIS DE COR E TEMA (PALETA FAZ DE CONTA RPG)
       ========================================================================== */
    :root {
      --bg-dark: #1f1811;
      --bg-papiro: #f4e8c1;
      --border-papiro: #7a5230;
      --border-papiro-dark: #4a3018;
      --text-main: #331e0b;
      --gold-primary: #f5ab2b;
      --gold-hover: #ffd166;
      --font-pixel: 'Press Start 2P', monospace;
      --font-pixel-large: 'VT323', monospace;
      --font-body: 'MedievalSharp', cursive, serif;
    }

    /* ==========================================================================
       2. RESET E ESTILOS GERAIS
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    /* ==========================================================================
       3. CABEÇALHO E UTILITY BAR
       ========================================================================== */
    header {
      width: 100%;
      max-width: 800px;
      background-color: #2e1d11;
      border: 4px solid var(--border-papiro);
      box-shadow: 0 4px 0 #000;
      padding: 12px 16px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-family: var(--font-pixel);
      font-size: 0.85rem;
      color: var(--gold-primary);
      text-shadow: 2px 2px #000;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-restart {
      background: #731b1b;
      color: #fff;
      border: 2px solid #a32e2e;
      font-family: var(--font-pixel);
      font-size: 0.6rem;
      padding: 8px 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 #420f0f;
      transition: all 0.1s;
    }

    .btn-restart:active {
      transform: translateY(3px);
      box-shadow: 0 0 0;
    }

    /* ==========================================================================
       4. FOLHA DE PERGAMINHO / CONTAINER PRINCIPAL
       ========================================================================== */
    main {
      width: 100%;
      max-width: 800px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .parchment-card {
      background-color: var(--bg-papiro);
      border: 6px solid var(--border-papiro);
      outline: 3px solid var(--border-papiro-dark);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 0 30px rgba(122, 82, 48, 0.2);
      padding: 25px 20px;
      position: relative;
      margin-bottom: 20px;
      border-radius: 2px;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Efeito de bordas rasgadas nas pontas */
    .parchment-card::before, .parchment-card::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--bg-dark);
      border: 3px solid var(--border-papiro);
    }
    .parchment-card::before { top: -9px; left: -9px; }
    .parchment-card::after { bottom: -9px; right: -9px; }

    .reference-badge {
      font-family: var(--font-pixel);
      font-size: 0.8rem;
      color: #fff;
      background: var(--border-papiro-dark);
      display: inline-block;
      padding: 6px 12px;
      border: 2px solid var(--gold-primary);
      margin-bottom: 15px;
      box-shadow: 3px 3px 0 #000;
    }

    .game-title {
      font-family: var(--font-pixel);
      font-size: 1rem;
      color: var(--border-papiro-dark);
      margin-bottom: 15px;
      text-align: center;
      line-height: 1.5;
      text-transform: uppercase;
      border-bottom: 2px dashed var(--border-papiro);
      padding-bottom: 10px;
    }

    .story-text {
      font-size: 1.2rem;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 20px;
      text-align: justify;
    }

    .story-text p {
      margin-bottom: 12px;
    }

    .story-text h2, .story-text h3, .story-text h4 {
      font-family: var(--font-pixel);
      font-size: 0.85rem;
      color: var(--border-papiro-dark);
      margin: 15px 0 10px 0;
      line-height: 1.4;
    }

    .story-text ol {
      margin-left: 20px;
      margin-bottom: 12px;
    }

    .story-text ol li {
      margin-bottom: 8px;
    }

    /* ==========================================================================
       5. BOTÕES DE ESCOLHA / OPÇÕES
       ========================================================================== */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .choice-btn {
      background: var(--gold-primary);
      color: #2b1803;
      border: 3px solid var(--border-papiro-dark);
      font-family: var(--font-body);
      font-size: 1.15rem;
      font-weight: bold;
      padding: 12px 16px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--border-papiro-dark);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .choice-btn:hover {
      background: var(--gold-hover);
      transform: translateY(-2px);
      box-shadow: 0 7px 0 var(--border-papiro-dark);
    }

    .choice-btn:active {
      transform: translateY(5px);
      box-shadow: 0 0 0 var(--border-papiro-dark);
    }

    .choice-btn .ref-number {
      font-family: var(--font-pixel);
      font-size: 0.7rem;
      background: var(--border-papiro-dark);
      color: var(--gold-primary);
      padding: 4px 6px;
      border-radius: 2px;
      white-space: nowrap;
    }

    /* ==========================================================================
       6. CARD DE HISTÓRICO DE ESCOLHAS
       ========================================================================== */
    .history-card {
      background-color: #2a1f16;
      border: 4px solid var(--border-papiro);
      box-shadow: 0 6px 0 #000;
      padding: 18px;
      margin-bottom: 20px;
      color: #f4e8c1;
    }

    .history-header {
      font-family: var(--font-pixel);
      font-size: 0.75rem;
      color: var(--gold-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px dashed var(--border-papiro);
      padding-bottom: 8px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .history-list::-webkit-scrollbar {
      width: 6px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--border-papiro);
    }

    .history-item {
      font-size: 0.95rem;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: rgba(0,0,0,0.2);
      padding: 6px 10px;
      border-left: 3px solid var(--gold-primary);
    }

    .history-item .step-num {
      font-family: var(--font-pixel);
      font-size: 0.6rem;
      color: var(--gold-primary);
      white-space: nowrap;
      margin-top: 2px;
    }

    .history-item .step-text {
      color: #e2d2a4;
    }

    .history-empty {
      font-size: 0.95rem;
      color: #a38d78;
      font-style: italic;
    }

    /* ==========================================================================
       7. RODAPÉ E RESPONSIVIDADE
       ========================================================================== */
    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #9c826b;
      padding: 15px 0;
      margin-top: auto;
    }

    @media (max-width: 600px) {
      header {
        padding: 10px 12px;
      }

      .brand-title {
        font-size: 0.7rem;
      }

      .parchment-card {
        padding: 18px 14px;
      }

      .story-text {
        font-size: 1.05rem;
      }

      .choice-btn {
        font-size: 1rem;
        padding: 10px 12px;
      }

      .history-card {
        padding: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO FIXO DO SISTEMA -->
  <header>
    <div class="brand-title">
      <span>🎲🗡️</span> FAZ DE CONTA RPG
    </div>
    
    <!-- BOTÃO DE REINICIAR -->
    <button class="btn-restart" onclick="confirmRestart()">REINICIAR AVENTURA</button>

  <main>

    <p>Faz de Conta RPG • Um Grande RPG para Pequeninos!</p>
  </footer>

               <p>Com um som suave de engrenagens, a parede de pedra desliza para o lado, revelando um túnel iluminado por pedras fluorescentes! Caminhando por ele, você sai diretamente em uma clareira ensolarada nos Escombros. No chão da clareira, um pequeno baú dos Engenhoqueiros esperava por um explorador atento: dentro dele há vários pergaminhos mágicos e sacos cheios de moedas de Chuvisco! Você conseguiu escapar do labirinto usando sua inteligência e astúcia! Parabéns pela vitória!</p>`,
        choices: [
          { text: "🎉 Jogar Novamente", target: 0 }
        ]
      },
      132: {
        text: `<p><strong>TERCEIRA SAÍDA DA VITÓRIA: A ESCADARIA DAS CAVERNAS SEM LUZ</strong></p>
               <p>Guiando-se pelo mapa e pela sua intuição, você encontra uma porta de carvalho escondida atrás das estátuas velhas! Ao abri-la, encontra uma passagem de pedra que sobe suavemente até o topo da montanha dos Escombros.</p>
               <p>Ao empurrar a escotilha de saída, você sente o ar fresco da Terra da Chuva Miúda e vê o sol brilhando sobre Vila Velha! Na saída da caverna, o Mago Ancião Zaimen e seus amigos estavam esperando por você com aplausos e um grande piquenique repleto de bolos e suco de mel. Zaimen sorri e diz: <em>\"Parabéns, jovem herói! Você provou que a sabedoria e a observação superam qualquer armadilha!\"</em> Você venceu o Desafio Mágico!</p>`,

    /* ==========================================================================
       2. LÓGICA DO SISTEMA, HISTÓRICO & PERSISTÊNCIA (LOCALSTORAGE)
       ========================================================================== */
    let currentRef = 0;
    let historyPath = [];

    // Inicialização da página
    window.addEventListener('DOMContentLoaded', () => {
      const savedRef = localStorage.getItem('fazdeconta_current_ref');
      const savedHistory = localStorage.getItem('fazdeconta_history');

      if (savedHistory) {
        try {
          historyPath = JSON.parse(savedHistory);
        } catch(e) {
          historyPath = [];
        }
      }

      if (savedRef !== null && storyData[savedRef]) {
        currentRef = parseInt(savedRef, 10);
      } else {
        currentRef = 0;
        historyPath = [{ ref: 0, choiceText: "Início da Jornada" }];
      }

      renderReference(currentRef);
      renderHistory();
    });

    // Renderiza a referência atual na folha de pergaminho
    function renderReference(refId) {
      const card = document.getElementById('parchmentCard');
      const data = storyData[refId];

      if (!data) {
        card.innerHTML = `<p class="story-text">Erro: Referência ${refId} não encontrada.</p>`;
        return;
      }

      // Salva progresso no navegador
      localStorage.setItem('fazdeconta_current_ref', refId);
      currentRef = refId;

      // Monta badge / título
      let headerHTML = '';
      if (refId === 0) {
        headerHTML = `<div class="game-title">${data.title}</div>`;
      } else {
        headerHTML = `<div class="reference-badge">REFERÊNCIA ${refId}</div>`;
      }

      // Monta opções
      let optionsHTML = '';
      if (data.choices && data.choices.length > 0) {
        optionsHTML = `<div class="options-container">`;
        data.choices.forEach(choice => {
          const targetBadge = choice.target > 0 ? `<span class="ref-number">Vá para a ${choice.target}</span>` : '';
          const escapedText = choice.text.replace(/'/g, "\\'");
          optionsHTML += `
            <button class="choice-btn" onclick="makeChoice(${choice.target}, '${escapedText}')">
              <span>${choice.text}</span>
              ${targetBadge}
            </button>
          `;
        });
        optionsHTML += `</div>`;
      }

      // Injeta no DOM
      card.innerHTML = `
        ${headerHTML}
        <div class="story-text">${data.text}</div>
        ${optionsHTML}
      `;

      // Rola a página suavemente até o topo da folha
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Registra escolha no histórico e carrega nova referência
    function makeChoice(targetId, choiceText) {
      if (targetId === 0) {
        historyPath = [{ ref: 0, choiceText: "Início da Jornada" }];
      } else {
        historyPath.push({ ref: targetId, choiceText: choiceText });
      }

      localStorage.setItem('fazdeconta_history', JSON.stringify(historyPath));
      renderHistory();
      renderReference(targetId);
    }

    // Renderiza o card do histórico de escolhas
    function renderHistory() {
      const historyEl = document.getElementById('historyList');

      if (!historyPath || historyPath.length === 0) {
        historyEl.innerHTML = `<li class="history-empty">Nenhum passo registrado ainda.</li>`;
        return;
      }

      let html = '';
      historyPath.forEach((item, index) => {
        const refLabel = item.ref === 0 ? "Introdução" : `Ref. ${item.ref}`;
        html += `
          <li class="history-item">
            <span class="step-num">#${index + 1} [${refLabel}]:</span>
            <span class="step-text">${item.choiceText}</span>
          </li>
        `;
      });

      historyEl.innerHTML = html;

      // Mantém a rolagem do histórico no final
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    // Reiniciar aventura
    function confirmRestart() {
      if (confirm("Tem certeza de que deseja reiniciar sua aventura desde o início?")) {
        localStorage.removeItem('fazdeconta_current_ref');
        localStorage.removeItem('fazdeconta_history');
        historyPath = [{ ref: 0, choiceText: "Início da Jornada" }];
        renderHistory();
        renderReference(0);
      }
    }
  </script>
